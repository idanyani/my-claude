[project]
name = "my-claude"
version = "0.0.0"
description = "Personal global Claude Code configuration: settings and skills, mirrored from ~/.claude."
requires-python = ">=3.12"
# The skill scripts themselves are stdlib-only so consuming repos need no install; this project
# exists to test and lint them.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.10", "mypy>=1.14"]

[tool.pytest.ini_options]
# The skill scripts run as plain files (their own directory lands on sys.path), so tests import
# them the same way: top-level modules plus the `lib` package.
pythonpath = ["dot-claude/skills/resolve-issue/scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
files = ["dot-claude/skills", "tests"]
mypy_path = "dot-claude/skills/resolve-issue/scripts"
