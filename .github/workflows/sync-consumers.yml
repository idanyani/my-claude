# Consuming repos run the drift check against `main`, so a merge that changes the conventions makes
# every consumer's copy stale at once. This opens the re-sync PR in each of them. Setup and
# onboarding: docs/runbooks/copilot-sync-app.md.
name: Sync consumers

on:
  push:
    branches: [main]
    paths:
      - dot-claude/CLAUDE.md
      - scripts/sync_copilot_instructions.py
  # Onboarding a new consumer changes no file here; run this by hand after adding it to the app.
  workflow_dispatch:

# Queue rather than cancel: a cancelled run could leave a consumer with a half-made sync PR, and
# the later run regenerates from the newer `main` anyway.
concurrency:
  group: sync-consumers
  cancel-in-progress: false

# Writes to consumers go through the app token, never this workflow's own GITHUB_TOKEN: PRs that
# token opens trigger no workflows, so a consumer's required check would never report.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: gefen-chat
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Open sync PRs in stale consumers
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          gh auth setup-git
          python3 scripts/sync_consumers.py
