# Verification gate for every PR. Branch protection makes the `verify` job below a required check,
# so nothing reaches `main` without it. See dot-claude/skills/resolve-issue/references/git-workflow.md.
name: CI

on:
  pull_request:

# PR-only by design: branch protection blocks every direct push to `main`, so the PR run -- tested
# against the latest `main` -- is the one source of truth. A newer push to the same branch makes
# older runs obsolete; cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job id `verify` is the required status check that branch protection and auto-merge key on --
  # keep it stable.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Tests
        run: uv run pytest

  # Exercises the composite action consuming repos call, against this repo's own generated copy.
  # `pytest` already asserts that copy is current; this job proves the action itself runs.
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/check-copilot-instructions
